[project]
name = "stock-intelligence-platform"
version = "0.1.0"
description = "AI-powered research platform for Indian listed companies (NSE/BSE)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
markers = ["live: calls real external data providers (needs RUN_LIVE_TESTS=1)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
