name: Live data check

# Calls the real data providers (Yahoo Finance, Upstox, news feeds, and EODHD / Gemini if keys are set).
# Informational only: a provider outage should not block merging code.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/providers/**"
      - "backend/tests/test_live_*.py"
  schedule:
    - cron: "30 13 * * 1-5"   # 19:00 IST on weekdays, after market close

jobs:
  live:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUN_LIVE_TESTS: "1"
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -m live -s -v backend/tests/test_live_providers.py backend/tests/test_live_news.py backend/tests/test_live_ai.py
