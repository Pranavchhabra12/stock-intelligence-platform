name: Keep the API awake

# Render's free plan stops the API after 15 minutes without traffic, and waking it takes about
# a minute. A light request every 10 minutes keeps it ready while people in India are likely
# to visit (06:30 to 00:20 IST). Overnight it sleeps, which keeps monthly use (about 540 hours)
# well inside Render's 750 free hours. /health also checks the database, so a failed run here
# doubles as an outage alert.
on:
  schedule:
    - cron: "*/10 1-18 * * *"   # every 10 minutes, 01:00-18:50 UTC
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error --max-time 100 --retry 2 --retry-delay 10 \
            https://stock-intelligence-api-qjn3.onrender.com/health
