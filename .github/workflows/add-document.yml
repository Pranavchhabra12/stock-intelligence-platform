name: Add a company document

# Register a company PDF (annual report, results, presentation) by URL,
# then download it and extract its text into the database.
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "NSE symbol, e.g. RELIANCE"
        required: true
      document_type:
        description: "Type of document"
        required: true
        type: choice
        options: [annual_report, quarterly_results, investor_presentation, earnings_transcript, exchange_filing, other_disclosure]
      url:
        description: "Direct link to the PDF (https://...)"
        required: true
      title:
        description: "Title, e.g. Annual Report 2025-26"
        required: true
      period:
        description: "Fiscal period, e.g. FY2026 (optional)"
        required: false
        default: ""

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOG_LEVEL: WARNING
      TICKER: ${{ github.event.inputs.ticker }}
      DOC_TYPE: ${{ github.event.inputs.document_type }}
      DOC_URL: ${{ github.event.inputs.url }}
      DOC_TITLE: ${{ github.event.inputs.title }}
      DOC_PERIOD: ${{ github.event.inputs.period }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: alembic upgrade head
      - name: Add and process the document
        # Inputs are passed as environment variables, never pasted into the script.
        run: |
          args=(add "$TICKER" "$DOC_TYPE" "$DOC_URL" --title "$DOC_TITLE")
          if [ -n "$DOC_PERIOD" ]; then args+=(--period "$DOC_PERIOD"); fi
          python -m backend.documents "${args[@]}"
