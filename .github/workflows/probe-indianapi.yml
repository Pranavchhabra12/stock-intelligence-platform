name: Probe IndianAPI
on:
  push:
    branches: [indianapi-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Describe financials for a bank, an IT company and a conglomerate
        env:
          KEY: ${{ secrets.INDIANAPI_KEY }}
        run: |
          for q in HDFCBANK TCS RELIANCE; do
            curl -sS -o "$q.json" -w "$q: status %{http_code}, %{size_download} bytes\n" \
              -H "x-api-key: $KEY" "https://stock.indianapi.in/stock?name=$q"
          done
          python3 - <<'PY'
          import json
          for q in ["HDFCBANK", "TCS", "RELIANCE"]:
              d = json.load(open(f"{q}.json"))
              if not isinstance(d, dict) or "financials" not in d:
                  print(q, "->", str(d)[:300]); continue
              p = d.get("companyProfile") or {}
              print(f"\n######## {q}: name={d.get('companyName')!r} nse={p.get('exchangeCodeNse')} isin={p.get('isInId')}")
              for i, per in enumerate(d["financials"]):
                  m = per["stockFinancialMap"]
                  inc = {x["key"]: x["value"] for x in m.get("INC") or []}
                  bal = {x["key"]: x["value"] for x in m.get("BAL") or []}
                  head = f"{per['Type']:8} {per['EndDate']} FY{per['FiscalYear']} len={inc.get('periodLength')}{inc.get('periodType')}"
                  pick = {k: inc.get(k) for k in ("TotalRevenue", "Revenue", "NetIncome", "DilutedEPSExcludingExtraOrdItems",
                          "InterestIncomeBank", "Non-InterestIncomeBank", "NetInterestIncome")}
                  print(head, {k: v for k, v in pick.items() if v is not None},
                        "| equity", bal.get("TotalEquity"), "shares", bal.get("TotalCommonSharesOutstanding"), "| nINC", len(inc), "nBAL", len(bal))
                  if i in (0, 7):
                      print("   INC keys:", sorted(inc))
          PY
