name: Collect news feeds, filings and AI sentiment

# BSE's filing feeds only list the latest few items, so they are read every hour
# during market hours (09:00-19:00 IST, weekdays), with publisher feeds, Google News
# search and AI sentiment for anything new. Prices and GDELT run in the daily workflow.
on:
  schedule:
    - cron: "30 3-13 * * 1-5"   # :00 past each hour, 09:00-19:00 IST
  workflow_dispatch:

concurrency:
  group: collect-feeds
  cancel-in-progress: false

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: alembic upgrade head
      - run: python -m backend.scheduler.run_once --feeds
