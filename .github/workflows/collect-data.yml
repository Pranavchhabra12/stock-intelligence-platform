name: Collect market data

# The scheduled pipeline for the hosted demo (APScheduler does the same job locally).
# Needs a repository secret DATABASE_URL: the Supabase *Session pooler* connection string.
on:
  schedule:
    - cron: "0 14 * * 1-5"   # 19:30 IST on weekdays, after market close
  workflow_dispatch:
    inputs:
      tickers:
        description: "NSE symbols separated by spaces (leave empty for all companies)"
        required: false
        default: ""

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      LOG_LEVEL: WARNING
    steps:
      - name: Check the database secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL repository secret (Supabase session pooler string)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Apply migrations (no-op when up to date)
        run: alembic upgrade head
      - name: Load seed companies (idempotent)
        run: python -m backend.database.seed
      - name: Collect prices, corporate actions and financials
        env:
          TICKERS: ${{ github.event.inputs.tickers }}
        run: |
          if [ -z "$TICKERS" ]; then
            python -m backend.collect --all
          elif [[ "$TICKERS" =~ ^[A-Za-z0-9\&.\ -]+$ ]]; then
            # word-splitting is intended: one argument per ticker
            python -m backend.collect $TICKERS
          else
            echo "::error::Tickers may only contain letters, digits, &, ., - and spaces."
            exit 1
          fi
